<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .metric-num {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #f8fafc;
      }
      .metric-label {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
      }

      /* Dynamic Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 95px; y: 155px; }
        50% { height: 130px; y: 120px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 140px; y: 110px; }
        50% { height: 100px; y: 150px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 75px; y: 175px; }
        50% { height: 120px; y: 130px; }
      }

      .pulse-orb {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .floating-1 {
        animation: floatCard1 6s ease-in-out infinite;
      }
      .floating-2 {
        animation: floatCard2 7s ease-in-out infinite;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashMove 20s linear infinite;
      }
      .bar-anim-1 {
        animation: barGrow1 4.5s ease-in-out infinite;
      }
      .bar-anim-2 {
        animation: barGrow2 5s ease-in-out infinite;
      }
      .bar-anim-3 {
        animation: barGrow3 4.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Glowing Orbs -->
  <g class="pulse-orb" filter="url(#glow)">
    <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.12" />
    <circle cx="1050" cy="180" r="140" fill="#a855f7" opacity="0.15" />
    <circle cx="600" cy="300" r="100" fill="#6366f1" opacity="0.10" />
  </g>

  <!-- Background Grid Mesh -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Right Visual Analytics Graphic (Dynamic & Decorative) -->
  <g transform="translate(800, 45)" filter="url(#cardShadow)">
    <!-- Main Analytical Dashboard Display Card -->
    <rect x="0" y="0" width="340" height="265" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Card Header / Status Dots -->
    <circle cx="22" cy="22" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="22" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="50" cy="22" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="70" y="26" font-family="system-ui" font-size="11" font-weight="600" fill="#64748b">BI REAL-TIME TELEMETRY</text>

    <!-- Mini KPI Cards in Dashboard -->
    <rect x="18" y="42" width="94" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="26" y="58" class="metric-label">TOTAL QUERY</text>
    <text x="26" y="77" class="metric-num">3.4M/s</text>

    <rect x="122" y="42" width="94" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="58" class="metric-label">LATENCY</text>
    <text x="130" y="77" class="metric-num" fill="#38bdf8">14ms</text>

    <rect x="226" y="42" width="94" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="234" y="58" class="metric-label">ACCURACY</text>
    <text x="234" y="77" class="metric-num" fill="#10b981">99.9%</text>

    <!-- Chart Grid Baseline -->
    <line x1="20" y1="210" x2="320" y2="210" stroke="#334155" stroke-width="1.5" />
    <line x1="20" y1="160" x2="320" y2="160" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
    <line x1="20" y1="110" x2="320" y2="110" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />

    <!-- Animated Dynamic Bars -->
    <rect x="35" y="145" width="22" height="65" rx="4" fill="url(#barGrad1)" class="bar-anim-1" />
    <rect x="70" y="110" width="22" height="100" rx="4" fill="url(#barGrad2)" class="bar-anim-2" />
    <rect x="105" y="130" width="22" height="80" rx="4" fill="url(#barGrad1)" class="bar-anim-3" />
    <rect x="140" y="95" width="22" height="115" rx="4" fill="url(#barGrad3)" class="bar-anim-1" />
    <rect x="175" y="125" width="22" height="85" rx="4" fill="url(#barGrad2)" class="bar-anim-2" />
    <rect x="210" y="80" width="22" height="130" rx="4" fill="url(#barGrad1)" class="bar-anim-3" />
    <rect x="245" y="115" width="22" height="95" rx="4" fill="url(#barGrad3)" class="bar-anim-1" />
    <rect x="280" y="70" width="22" height="140" rx="4" fill="url(#barGrad2)" class="bar-anim-2" />

    <!-- Dynamic Overlay Trend Curve -->
    <path d="M 45 155 Q 80 115 115 135 T 185 110 T 255 90 T 290 65" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" class="wave-line" />
    <circle cx="290" cy="65" r="5" fill="#ec4899" filter="url(#glow)" />
    <circle cx="185" cy="110" r="4" fill="#38bdf8" />
    <circle cx="115" cy="135" r="4" fill="#818cf8" />

    <!-- Bottom Sparkline / Semantic Status -->
    <path d="M 25 240 L 70 232 L 120 245 L 180 225 L 230 235 L 280 220 L 315 228" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Floating Badge 1 (Open Source / Top Left of Graphic) -->
  <g class="floating-1" transform="translate(740, 20)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="165" height="40" rx="20" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="20" cy="20" r="6" fill="#10b981" />
    <text x="35" y="24" class="badge-text" fill="#c7d2fe">✨ Open-Source &amp; Cloud</text>
  </g>

  <!-- Floating Badge 2 (Enterprise Ready / Bottom Left of Graphic) -->
  <g class="floating-2" transform="translate(710, 275)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="22" y="26" class="badge-text" fill="#38bdf8">⚡ Semantic Layers &amp; SQL</text>
  </g>

  <!-- Left Content Block: Title, Subtitle, Feature Badges (Always Clear Foreground) -->
  <g transform="translate(70, 75)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="245" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
      <text x="14" y="18" font-family="system-ui" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED DATA ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 56)">
      <text class="title-text" fill="url(#primaryGrad)">Business Intelligence</text>
      <text y="48" class="title-text" fill="#ffffff">&amp; Visualization</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 142)">
      <text class="subtitle-text">The definitive guide to enterprise BI suites, self-hosted open-source</text>
      <text y="24" class="subtitle-text">dashboards, semantic layers, and conversational analytics engines.</text>
    </g>

    <!-- Interactive / Highlighting Category Pills -->
    <g transform="translate(0, 198)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">📊 Power BI &amp; Tableau</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">🔓 Superset &amp; Metabase</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(305, 0)">
        <rect x="0" y="0" width="125" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">🧊 Cube &amp; Evidence</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#38bdf8">📈 Grafana &amp; Streamlit</text>
      </g>
    </g>
  </g>
</svg>
